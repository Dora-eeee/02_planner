<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header-title">
        <h1>Smart Campus Planner</h1>
      </div>
      <div class="app-header-side">
        <span class="side-label">Today</span>
        <span id="today-date" class="side-value"></span>
      </div>
    </header>

    <main>
      <!-- 할 일 입력 영역 -->
      <section class="card form-card">
        <h2>새 할 일 추가</h2>
        <form id="todo-form" novalidate>
          <div class="form-row">
            <label for="title">할 일 제목</label>
            <input
              type="text"
              id="title"
              name="title"
              placeholder="예: 자료구조 과제 제출"
              maxlength="100"
              required
            >
          </div>

          <div class="form-grid">
            <div class="form-row">
              <label for="category">카테고리</label>
              <select id="category" name="category" required>
                <option value="" disabled selected>선택하세요</option>
                <option value="dept">학과</option>
                <option value="club">동아리</option>
                <option value="personal">개인</option>
              </select>
            </div>

            <div class="form-row">
              <label for="priority">중요도</label>
              <select id="priority" name="priority" required>
                <option value="" disabled selected>선택하세요</option>
                <option value="high">상</option>
                <option value="mid">중</option>
                <option value="low">하</option>
              </select>
            </div>

            <div class="form-row">
              <label for="dueDate">마감일</label>
              <input type="date" id="dueDate" name="dueDate" required>
            </div>
          </div>

          <p id="form-error" class="form-error" hidden></p>

          <button type="submit" class="btn-add">+ 할 일 추가</button>
        </form>
      </section>

      <!-- 할 일 목록 영역 -->
      <section class="card list-card">
        <div class="list-header">
          <h2>할 일 목록</h2>
          <span id="todo-count" class="todo-count">0개</span>
        </div>

        <div class="progress-section">
          <div class="progress-info">
            <span>전체 완료율</span>
            <span id="progress-percent">0%</span>
          </div>
          <div class="progress-bar-track">
            <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%"></div>
          </div>
          <p id="progress-detail" class="progress-detail">완료 0개 / 전체 0개</p>
        </div>

        <p id="empty-message" class="empty-message">등록된 할 일이 없습니다. 위에서 새 할 일을 추가해보세요!</p>

        <ul id="todo-list" class="todo-list" hidden></ul>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
